services:
  - type: web
    name: sdspass-api-3
    runtime: python
    buildCommand: apt-get install -y fonts-dejavu && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SDSPASS_DATA_REPO
        value: scanece-jpg/sdspass-data
      - key: SDSPASS_DATA_TOKEN
        sync: false
    healthCheckPath: /health
