<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>SDSPass — Logo Önerileri</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: #080809; color: #E2DFD8; padding: 48px; }
  h1 { font-size: 13px; font-weight: 600; color: #4A4946; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 48px; }
  .row { display: flex; gap: 32px; flex-wrap: wrap; margin-bottom: 64px; }
  .card {
    background: #111113;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 40px;
    display: flex; flex-direction: column; align-items: center; gap: 24px;
  }
  .card-label { font-size: 11px; color: #4A4946; letter-spacing: 1px; text-transform: uppercase; }
  .card-dark { background: #080809; }
  .card-light { background: #E2DFD8; }
  .section-title { font-size: 12px; color: #4A4946; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 20px; }
  .divider { height: 1px; background: rgba(255,255,255,0.07); margin: 48px 0; }
</style>
</head>
<body>

<h1>SDSPass — Logo Tasarım Önerileri</h1>

<!-- ══════════════════════════
     SEÇENEK A — Kalkan + S
══════════════════════════ -->
<div class="section-title">Seçenek A — Kalkan</div>
<div class="row">

  <!-- Koyu arka plan -->
  <div class="card card-dark">
    <svg width="200" height="52" viewBox="0 0 200 52" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- İkon: Kalkan -->
      <path d="M10 8 L26 4 L42 8 L42 24 C42 34 26 44 26 44 C26 44 10 34 10 24 Z" fill="none" stroke="#E2DFD8" stroke-width="2" stroke-linejoin="round"/>
      <path d="M19 24 L24 29 L33 19" stroke="#E2DFD8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Wordmark -->
      <text x="56" y="33" font-family="Inter, sans-serif" font-weight="700" font-size="22" fill="#E2DFD8" letter-spacing="-0.5">SDSPass</text>
    </svg>
    <span class="card-label">Koyu versiyon</span>
  </div>

  <!-- Açık arka plan -->
  <div class="card card-light">
    <svg width="200" height="52" viewBox="0 0 200 52" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 8 L26 4 L42 8 L42 24 C42 34 26 44 26 44 C26 44 10 34 10 24 Z" fill="none" stroke="#080809" stroke-width="2" stroke-linejoin="round"/>
      <path d="M19 24 L24 29 L33 19" stroke="#080809" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="33" font-family="Inter, sans-serif" font-weight="700" font-size="22" fill="#080809" letter-spacing="-0.5">SDSPass</text>
    </svg>
    <span class="card-label" style="color:#080809;opacity:.4;">Açık versiyon</span>
  </div>

  <!-- Sadece ikon -->
  <div class="card card-dark">
    <svg width="52" height="52" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 8 L26 4 L42 8 L42 24 C42 34 26 44 26 44 C26 44 10 34 10 24 Z" fill="none" stroke="#E2DFD8" stroke-width="2" stroke-linejoin="round"/>
      <path d="M19 24 L24 29 L33 19" stroke="#E2DFD8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="card-label">Sadece ikon</span>
  </div>

</div>

<div class="divider"></div>

<!-- ══════════════════════════
     SEÇENEK B — Belge + Onay
══════════════════════════ -->
<div class="section-title">Seçenek B — Belge</div>
<div class="row">

  <div class="card card-dark">
    <svg width="200" height="52" viewBox="0 0 200 52" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- İkon: Belge -->
      <rect x="10" y="4" width="28" height="36" rx="4" fill="none" stroke="#E2DFD8" stroke-width="2"/>
      <path d="M18 4 L18 16 L38 16" stroke="#E2DFD8" stroke-width="2" stroke-linecap="round"/>
      <path d="M38 4 L18 16" stroke="#E2DFD8" stroke-width="2" stroke-linecap="round"/>
      <line x1="16" y1="24" x2="32" y2="24" stroke="#E2DFD8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
      <line x1="16" y1="30" x2="28" y2="30" stroke="#E2DFD8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
      <!-- Wordmark -->
      <text x="52" y="33" font-family="Inter, sans-serif" font-weight="700" font-size="22" fill="#E2DFD8" letter-spacing="-0.5">SDSPass</text>
    </svg>
    <span class="card-label">Koyu versiyon</span>
  </div>

  <div class="card card-light">
    <svg width="200" height="52" viewBox="0 0 200 52" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="10" y="4" width="28" height="36" rx="4" fill="none" stroke="#080809" stroke-width="2"/>
      <path d="M18 4 L18 16 L38 16" stroke="#080809" stroke-width="2" stroke-linecap="round"/>
      <path d="M38 4 L18 16" stroke="#080809" stroke-width="2" stroke-linecap="round"/>
      <line x1="16" y1="24" x2="32" y2="24" stroke="#080809" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
      <line x1="16" y1="30" x2="28" y2="30" stroke="#080809" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
      <text x="52" y="33" font-family="Inter, sans-serif" font-weight="700" font-size="22" fill="#080809" letter-spacing="-0.5">SDSPass</text>
    </svg>
    <span class="card-label" style="color:#080809;opacity:.4;">Açık versiyon</span>
  </div>

  <div class="card card-dark">
    <svg width="52" height="52" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="10" y="4" width="28" height="36" rx="4" fill="none" stroke="#E2DFD8" stroke-width="2"/>
      <path d="M18 4 L18 16 L38 16" stroke="#E2DFD8" stroke-width="2" stroke-linecap="round"/>
      <path d="M38 4 L18 16" stroke="#E2DFD8" stroke-width="2" stroke-linecap="round"/>
      <line x1="16" y1="24" x2="32" y2="24" stroke="#E2DFD8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
      <line x1="16" y1="30" x2="28" y2="30" stroke="#E2DFD8" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    </svg>
    <span class="card-label">Sadece ikon</span>
  </div>

</div>

<div class="divider"></div>

<!-- ══════════════════════════
     SEÇENEK C — Monogram S
══════════════════════════ -->
<div class="section-title">Seçenek C — Monogram</div>
<div class="row">

  <div class="card card-dark">
    <svg width="200" height="52" viewBox="0 0 200 52" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- İkon: S harfi kare içinde -->
      <rect x="8" y="6" width="38" height="38" rx="10" fill="none" stroke="#E2DFD8" stroke-width="2"/>
      <text x="18" y="33" font-family="Inter, sans-serif" font-weight="800" font-size="22" fill="#E2DFD8">S</text>
      <!-- Wordmark -->
      <text x="58" y="33" font-family="Inter, sans-serif" font-weight="700" font-size="22" fill="#E2DFD8" letter-spacing="-0.5">SDSPass</text>
    </svg>
    <span class="card-label">Koyu versiyon</span>
  </div>

  <div class="card card-light">
    <svg width="200" height="52" viewBox="0 0 200 52" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="8" y="6" width="38" height="38" rx="10" fill="none" stroke="#080809" stroke-width="2"/>
      <text x="18" y="33" font-family="Inter, sans-serif" font-weight="800" font-size="22" fill="#080809">S</text>
      <text x="58" y="33" font-family="Inter, sans-serif" font-weight="700" font-size="22" fill="#080809" letter-spacing="-0.5">SDSPass</text>
    </svg>
    <span class="card-label" style="color:#080809;opacity:.4;">Açık versiyon</span>
  </div>

  <div class="card card-dark">
    <svg width="52" height="52" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="6" y="6" width="40" height="40" rx="11" fill="none" stroke="#E2DFD8" stroke-width="2"/>
      <text x="14" y="35" font-family="Inter, sans-serif" font-weight="800" font-size="24" fill="#E2DFD8">S</text>
    </svg>
    <span class="card-label">Sadece ikon</span>
  </div>

  <!-- Dolu versiyon -->
  <div class="card card-dark">
    <svg width="52" height="52" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="6" y="6" width="40" height="40" rx="11" fill="#E2DFD8"/>
      <text x="14" y="35" font-family="Inter, sans-serif" font-weight="800" font-size="24" fill="#080809">S</text>
    </svg>
    <span class="card-label">Dolu versiyon</span>
  </div>

</div>

<div class="divider"></div>

<!-- ══════════════════════════
     SEÇENEK D — Saf Wordmark
══════════════════════════ -->
<div class="section-title">Seçenek D — Wordmark (sadece yazı)</div>
<div class="row">

  <div class="card card-dark">
    <svg width="220" height="52" viewBox="0 0 220 52" fill="none" xmlns="http://www.w3.org/2000/svg">
      <text x="0" y="36" font-family="Inter, sans-serif" font-weight="800" font-size="28" fill="#E2DFD8" letter-spacing="-1">SDSPass</text>
    </svg>
    <span class="card-label">Bold</span>
  </div>

  <div class="card card-dark">
    <svg width="240" height="52" viewBox="0 0 240 52" fill="none" xmlns="http://www.w3.org/2000/svg">
      <text x="0" y="30" font-family="Inter, sans-serif" font-weight="800" font-size="22" fill="#E2DFD8" letter-spacing="-0.5">SDSPass</text>
      <text x="2" y="46" font-family="Inter, sans-serif" font-weight="400" font-size="10" fill="#4A4946" letter-spacing="3">GBF PLATFORMU</text>
    </svg>
    <span class="card-label">Başlık + Alt yazı</span>
  </div>

  <div class="card card-dark">
    <svg width="220" height="52" viewBox="0 0 220 52" fill="none" xmlns="http://www.w3.org/2000/svg">
      <text x="0" y="36" font-family="Inter, sans-serif" font-weight="700" font-size="28" fill="#E2DFD8" letter-spacing="2">SDS<tspan fill="#8A8880">Pass</tspan></text>
    </svg>
    <span class="card-label">İki tonlu</span>
  </div>

</div>

</body>
</html>
