<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SDSPass v2 — Modüler Hesaplama</title>
<style>
:root{
  --bg:#0f0f1a;--bg2:#16162a;--bg3:#1e1e32;
  --accent:#7c6af7;--accent2:#5b4dd4;
  --text:#e0e0f0;--text2:#b0b0c8;--text3:#6a6a88;
  --border:#2a2a44;--border2:#3a3a58;
  --danger:#ff6b6b;--warn:#f5a623;--safe:#00e5b0;--info:#64b5f6;
  --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh}
.app{display:grid;grid-template-columns:1fr 380px;gap:0;min-height:100vh}
.left{padding:20px;overflow-y:auto;border-right:1px solid var(--border)}
.right{padding:20px;overflow-y:auto;background:var(--bg2)}

/* Header */
.hdr{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.hdr-logo{font-size:20px;font-weight:800;color:var(--accent);font-family:var(--mono)}
.hdr-sub{font-size:11px;color:var(--text3)}
.version-badge{font-size:9px;background:var(--accent);color:#fff;padding:2px 6px;border-radius:10px;font-family:var(--mono)}

/* Product info */
.product-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:16px}
.product-card label{font-size:10px;color:var(--text3);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.product-card input,.product-card select{width:100%;background:var(--bg2);border:1px solid var(--border2);color:var(--text);border-radius:6px;padding:7px 10px;font-size:12px;font-family:var(--mono)}
.product-card input:focus,.product-card select:focus{outline:2px solid var(--accent);border-color:transparent}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}

/* Component rows */
.comps-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.comps-title{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.1em}
.btn-add{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:11px;cursor:pointer;font-weight:600}
.btn-add:hover{background:var(--accent2)}

.cw{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;position:relative}
.cw-row{display:grid;grid-template-columns:140px 1fr;gap:8px;margin-bottom:8px}
.cw-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.cw input,.cw select{background:var(--bg2);border:1px solid var(--border2);color:var(--text);border-radius:6px;padding:6px 9px;font-size:11px;font-family:var(--mono);width:100%}
.cw input:focus,.cw select:focus{outline:2px solid var(--accent);border-color:transparent}
.cw label{font-size:9px;color:var(--text3);display:block;margin-bottom:3px;text-transform:uppercase}
.cdel{position:absolute;top:10px;right:10px;background:transparent;border:1px solid var(--border);color:var(--text3);width:22px;height:22px;border-radius:4px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.cdel:hover{border-color:var(--danger);color:var(--danger)}

/* Hazard chips */
.chip-area{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;min-height:24px}
.hchip{display:inline-flex;align-items:center;gap:4px;background:rgba(124,106,247,.15);border:1px solid rgba(124,106,247,.3);color:var(--accent);border-radius:4px;padding:2px 7px;font-size:10px;font-family:var(--mono);cursor:default}
.hchip.danger{background:rgba(255,107,107,.12);border-color:rgba(255,107,107,.3);color:var(--danger)}
.hchip.warn{background:rgba(245,166,35,.12);border-color:rgba(245,166,35,.3);color:var(--warn)}
.hchip-del{background:none;border:none;color:inherit;cursor:pointer;font-size:11px;padding:0;line-height:1;opacity:.6}
.hchip-del:hover{opacity:1}
.add-chip-btn{background:none;border:1px dashed var(--border2);color:var(--text3);border-radius:4px;padding:2px 8px;font-size:10px;cursor:pointer}
.add-chip-btn:hover{border-color:var(--accent);color:var(--accent)}

/* Concentration select */
.conc-sel{width:100%;padding:6px 8px;border-radius:6px;border:1px solid var(--border2);background:var(--bg);color:var(--text);font-family:var(--mono);font-size:11px;cursor:pointer}

/* ── Fiziksel Özellikler Modal ────────────────────────────────────────── */
.phys-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;display:none;align-items:center;justify-content:center}
.phys-modal-overlay.open{display:flex}
.phys-modal{background:var(--bg2);border:1px solid var(--border2);border-radius:12px;width:min(640px,96vw);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.6)}
.phys-modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border2);background:var(--bg3)}
.phys-modal-head h3{margin:0;font-size:13px;color:var(--text);font-family:var(--mono)}
.phys-modal-close{background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer;padding:2px 6px;border-radius:4px;line-height:1}
.phys-modal-close:hover{color:var(--text);background:var(--border2)}
.phys-modal-body{overflow-y:auto;padding:12px 16px;flex:1}
.phys-modal-body::-webkit-scrollbar{width:6px}
.phys-modal-body::-webkit-scrollbar-track{background:var(--bg3)}
.phys-modal-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.pm-row{display:grid;grid-template-columns:160px 1fr;gap:4px 12px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04);align-items:start}
.pm-row:last-child{border-bottom:none}
.pm-label{font-size:10px;color:var(--text3);padding-top:2px}
.pm-val{font-family:var(--mono);font-size:11px;font-weight:700;color:#e2e8f0}
.pm-na{font-size:10px;color:var(--text3);font-style:italic}
.pm-meta{font-size:9px;color:var(--text3);margin-top:2px;font-style:italic;line-height:1.5}
.pm-badge-meas{font-size:8px;padding:1px 5px;border-radius:8px;background:rgba(104,211,145,.15);color:#68d391;font-weight:600;margin-left:5px;vertical-align:middle}
.pm-badge-err{font-size:9px;color:#f6ad55;margin-left:5px}

/* Compact phys summary card */
.phys-summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-bottom:8px}
.phys-chip{background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:7px 10px}
.phys-chip-label{font-size:9px;color:var(--text3);margin-bottom:3px}
.phys-chip-val{font-family:var(--mono);font-size:12px;font-weight:700;color:#e2e8f0}
.phys-chip-sub{font-size:8px;color:var(--text3);margin-top:2px}

/* Refinement panel */
.crp{margin-top:6px;border-radius:8px;overflow:hidden;border:1px solid var(--border2);display:none}
.crp-head{background:rgba(245,166,35,.08);border-bottom:1px solid rgba(245,166,35,.2);padding:8px 12px;font-size:11px;color:var(--warn)}
.crp-btns{display:flex;gap:6px;padding:8px 10px;background:var(--bg3)}
.crp-btn{flex:1;border:1px solid var(--border2);background:var(--bg2);color:var(--text2);border-radius:6px;padding:8px;font-size:10px;font-family:var(--mono);cursor:pointer;text-align:center}
.crp-btn:hover{border-color:var(--accent);color:var(--accent)}
.crp-btn.danger-border{border-color:rgba(255,107,107,.4);color:var(--danger)}
.crp-btn.warn-border{border-color:rgba(245,166,35,.4);color:var(--warn)}
.crp-btn.safe-border{border-color:rgba(0,229,176,.4);color:var(--safe)}

/* Calc bar */
.calc-bar{display:flex;gap:8px;margin-bottom:20px;padding:14px;background:var(--bg3);border-radius:10px;border:1px solid var(--border)}
.bcalc{flex:1;background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:700;cursor:pointer}
.bcalc:hover{background:var(--accent2)}
.bcalc:active{transform:scale(.98)}

/* Results right panel */
.r-section{margin-bottom:16px}
.r-title{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;padding:8px 0 6px;border-top:1px solid var(--border);margin-top:8px}
.r-title:first-child{border-top:none;padding-top:0}
.result-banner{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px}
.signal-danger{color:var(--danger);font-weight:700;font-size:13px}
.signal-warning{color:var(--warn);font-weight:700;font-size:13px}
.signal-none{color:var(--text3);font-weight:600;font-size:12px}
.hcode-pills{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.hpill{padding:3px 8px;border-radius:4px;font-family:var(--mono);font-size:11px;font-weight:700}
.hpill.hp-danger{background:rgba(255,107,107,.15);color:var(--danger);border:1px solid rgba(255,107,107,.3)}
.hpill.hp-warn{background:rgba(245,166,35,.15);color:var(--warn);border:1px solid rgba(245,166,35,.3)}
.hpill.hp-info{background:rgba(100,181,246,.1);color:var(--info);border:1px solid rgba(100,181,246,.25)}
.pictogram-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ghs-icon{width:48px;height:48px;display:flex;flex-direction:column;align-items:center;gap:2px}
.ghs-icon .sym{font-size:28px;line-height:1}
.ghs-icon .lbl{font-size:8px;color:var(--text3);font-family:var(--mono)}

.ecard{background:var(--bg3);border:1px solid var(--border);border-left:3px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:6px}
.ecard.danger{border-left-color:var(--danger)}
.ecard.warning{border-left-color:var(--warn)}
.ecard.info{border-left-color:var(--info)}
.ecard-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.ecard-code{font-family:var(--mono);font-size:13px;font-weight:800}
.ecard-label{font-size:10px;color:var(--text2);flex:1}
.ecard-source{font-size:10px;color:var(--text3);font-family:var(--mono);margin-top:3px}
.sbadge{font-size:9px;padding:2px 6px;border-radius:10px;font-weight:700}
.sbadge.danger{background:rgba(255,107,107,.2);color:var(--danger)}
.sbadge.warning{background:rgba(245,166,35,.2);color:var(--warn)}

/* Transport */
.transport-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.transport-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px;text-align:center}
.transport-card .t-mode{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.transport-card .t-un{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent)}
.transport-card .t-class{font-size:10px;color:var(--text2);margin-top:2px}

/* PPE */
.ppe-category{margin-bottom:8px}
.ppe-cat-title{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.ppe-item{font-size:11px;color:var(--text2);padding:3px 0;display:flex;align-items:flex-start;gap:6px}
.ppe-item::before{content:'✓';color:var(--safe);flex-shrink:0;font-size:10px;margin-top:1px}

.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;color:var(--text3);gap:8px}
.empty-state .es-icon{font-size:32px;opacity:.3}
.empty-state .es-text{font-size:12px}

.warn-box{background:rgba(245,166,35,.06);border:1px solid rgba(245,166,35,.2);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:11px;color:var(--warn)}

/* Section 3 table */
.s3-table{width:100%;border-collapse:collapse;font-size:10px;margin-bottom:8px}
.s3-table th{color:var(--text3);text-align:left;padding:3px 6px;border-bottom:1px solid var(--border);font-weight:600}
.s3-table td{padding:4px 6px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--text2)}
.s3-table td:first-child{font-family:var(--mono);color:var(--text3)}
.s3-table td:last-child{color:var(--accent);font-family:var(--mono)}

@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ecard,.result-banner{animation:fadeUp .2s ease both}
</style>
</head>
<body>
<div class="app">
<!-- ═══ SOL PANEL — Girdi ═══════════════════════════════════════════════════ -->
<div class="left">
  <div class="hdr">
    <div>
      <div class="hdr-logo">SDSPass</div>
      <div class="hdr-sub">KKDİK / CLP Karışım Sınıflandırma</div>
    </div>
    <span class="version-badge">v2.0 Modüler</span>
  </div>

  <!-- Ürün Bilgileri -->
  <div class="product-card">
    <label>Ürün Adı</label>
    <input type="text" id="productName" placeholder="Ürün / Formülasyon adı">
    <div class="row2">
      <div>
        <label>Form</label>
        <select id="pform">
          <option value="liquid">Sıvı</option>
          <option value="solid">Katı</option>
          <option value="gas">Gaz</option>
          <option value="paste">Pasta / Gel</option>
          <option value="powder">Toz</option>
        </select>
      </div>
      <div>
        <label>Kullanım Tipi</label>
        <select id="pusage">
          <option value="industrial">Endüstriyel</option>
          <option value="professional">Profesyonel</option>
          <option value="consumer">Tüketici</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Bileşenler -->
  <div class="comps-header">
    <span class="comps-title">🧪 Bileşenler</span>
    <button class="btn-add" onclick="addComp()">+ Madde Ekle</button>
  </div>
  <div id="comps"></div>

  <!-- Bölüm 9 — Fiziksel ve Kimyasal Özellikler -->
  <div class="product-card" style="margin-top:10px">
    <label style="font-weight:700;color:var(--text2);margin:0 0 10px;display:block">🧪 Bölüm 9 — Fiziksel ve Kimyasal Özellikler</label>

    <!-- 4 alan her zaman görünür -->
    <div class="row2">
      <div>
        <label>Fiziksel Form / Renk</label>
        <input type="text" id="tf_appearance" placeholder="Ör: Şeffaf, renksiz sıvı">
      </div>
      <div>
        <label>Koku</label>
        <input type="text" id="tf_odor" placeholder="Ör: Keskin, karakteristik">
      </div>
    </div>
    <div class="row2" style="margin-top:8px">
      <div>
        <label>pH Değeri <span style="color:var(--safe);font-size:8px">● motor</span></label>
        <input type="number" id="tf_ph" placeholder="Ör: 7.0 — override için girin" step="0.1" min="0" max="14">
      </div>
      <div>
        <label>Yoğunluk (g/mL) <span style="color:var(--safe);font-size:8px">● motor</span></label>
        <input type="number" id="tf_density" placeholder="ISO 2811 — override için girin" step="0.001">
      </div>
    </div>

    <!-- Daha fazla... toggle -->
    <div id="sec9Extra" style="display:none;margin-top:10px">

      <!-- Görünüm / Koku devamı -->
      <div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin:0 0 6px;padding-bottom:4px;border-bottom:1px solid var(--border2)">Görünüm</div>
      <div class="row2">
        <div>
          <label>Koku Eşiği (ppm)</label>
          <input type="number" id="tf_odor_thresh" placeholder="Ör: 0.5" step="0.01">
        </div>
      </div>

      <!-- Termal Özellikler -->
      <div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--border2)">Termal Özellikler</div>
      <div class="row2">
        <div>
          <label>Erime / Donma Noktası (°C)</label>
          <input type="number" id="tf_mp" placeholder="Ör: -20">
        </div>
        <div>
          <label>Kaynama Noktası (°C) <span style="color:var(--safe);font-size:8px">● motor</span></label>
          <input type="number" id="tf_bp" placeholder="IBP — override için girin">
        </div>
      </div>
      <div class="row2" style="margin-top:8px">
        <div>
          <label>Parlama Noktası (°C) <span style="color:var(--safe);font-size:8px">● motor</span></label>
          <input type="number" id="tf_fp" placeholder="DB'den hesaplanır — override">
        </div>
        <div>
          <label>Buharlaşma Hızı</label>
          <input type="text" id="tf_evap" placeholder="Ör: &lt;1 (n-BuAc=1), Yavaş">
        </div>
      </div>
      <div class="row2" style="margin-top:8px">
        <div>
          <label>Kendiliğinden Tutuşma (°C)</label>
          <input type="number" id="tf_ait" placeholder="Ör: 400">
        </div>
        <div>
          <label>Bozunma Sıcaklığı (°C)</label>
          <input type="number" id="tf_decomp" placeholder="Ör: 250">
        </div>
      </div>

      <!-- Alevlenirlik / Patlama -->
      <div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--border2)">Alevlenirlik (LEL/UEL motorda hesaplanır)</div>
      <div class="row2">
        <div>
          <label>Alevlenirlik — Katı/Gaz</label>
          <input type="text" id="tf_flam_sg" placeholder="Ör: Yanmaz / Uygulanamaz">
        </div>
        <div>
          <label>Patlayıcı Özellikler</label>
          <input type="text" id="tf_expl" placeholder="Ör: Uygulanamaz">
        </div>
      </div>

      <!-- Yoğunluk ve Basınç -->
      <div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--border2)">Diğer <span style="font-size:8px;color:var(--safe)">(●●● motor hesaplar)</span></div>
      <div class="row2">
        <div>
          <label>Oksitleyici Özellikler</label>
          <input type="text" id="tf_oxid" placeholder="Ör: Uygulanamaz">
        </div>
      </div>

      <!-- Çözünürlük ve Diğer -->
      <div style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--border2)">Çözünürlük ve Diğer</div>
      <div class="row2">
        <div>
          <label>Su Çözünürlüğü <span style="color:var(--safe);font-size:8px">● motor</span></label>
          <input type="number" id="tf_sol" placeholder="mg/L — override için girin">
        </div>
        <div>
          <label>Dağılım Katsayısı (log Kow)</label>
          <input type="number" id="tf_logkow" placeholder="Ör: 2.5" step="0.01">
        </div>
      </div>
      <div class="row2" style="margin-top:8px">
        <div>
          <label>Viskozite (mPa·s) <span style="color:var(--safe);font-size:8px">● motor</span></label>
          <input type="number" id="tf_visc" placeholder="override için girin">
        </div>
        <div>
          <label>Diğer Çözücülerde Çözünürlük</label>
          <input type="text" id="tf_sol_other" placeholder="Ör: Etanol'de karışabilir">
        </div>
      </div>
    </div>

    <button onclick="toggleSec9Extra()" id="sec9ExtraBtn"
            style="margin-top:10px;width:100%;background:none;border:1px dashed var(--border2);color:var(--text3);font-size:11px;padding:6px;border-radius:6px;cursor:pointer">
      ▼ Daha fazla...
    </button>
  </div>

  <!-- Hesapla -->
  <div class="calc-bar">
    <button class="bcalc" onclick="doCalculate()">⚡ Hesapla</button>
  </div>

</div>

<!-- ═══ SAĞ PANEL — Sonuçlar ════════════════════════════════════════════════ -->
<div class="right">
  <div id="results">
    <div class="empty-state">
      <div class="es-icon">⚗️</div>
      <div class="es-text">Bileşen ekleyip Hesapla'ya basın</div>
    </div>
  </div>
</div>
</div>

<!-- ══ ENGINE SCRIPTS ═══════════════════════════════════════════════════════ -->
<script>
  window.HAZARDDESK_API_URL = 'https://sdspass-api-3.onrender.com/api/v1/sds/pdf';
</script>
<script src="js/event-bus.js"></script>
<script src="js/state-store.js"></script>
<script src="js/engines/clp_engine.js"></script>
<script src="js/engines/pcode_engine.js"></script>
<script src="js/engines/eco_engine.js"></script>
<script src="js/engines/stot_engine.js"></script>
<script src="js/engines/euh_engine.js"></script>
<script src="js/engines/transport_engine.js"></script>
<script src="js/engines/ppe_engine.js"></script>
<script src="js/engines/physical_engine.js"></script>

<script>
// ══════════════════════════════════════════════════════════════════════════════
//  SDSPass v2 — UI Shell
//  Tüm hesaplama mantığı engine'lerde. Bu dosya sadece:
//  1. DOM yönetimi (bileşen ekle/sil, girdi oku)

function delComp(id) { document.getElementById('cw'+id)?.remove(); }

function addChip(id, hclass, hcode) {
  const chips = document.getElementById('chips'+id);
  if (!chips) return;
  const code = (hcode||'').replace(/[*\s]/g,'').substring(0,4);
  if ([...chips.querySelectorAll('.hchip')].some(c => c.dataset.code === code)) return;
  const cls = DANGER_H.has(code) ? 'danger' : 'warn';
  const span = document.createElement('span');
  span.className = `hchip ${cls}`;
  span.dataset.hc = hclass; span.dataset.code = hcode;
  span.innerHTML = `${hcode||hclass} <button class="hchip-del" onclick="this.parentNode.remove()">×</button>`;
  chips.appendChild(span);
}

function showChipInput(id) {
  const hc = prompt('Tehlike sınıfı girin (örn: Skin Corr. 1A):');
  if (!hc) return;
  const hcode = prompt('H kodu girin (örn: H314):') || '';
  addChip(id, hc.trim(), hcode.trim());
}

// ── CAS Lookup — debounce ile otomatik tetikle ────────────────────────────────
const _casTimers = {};
function debounceCas(id) {
  clearTimeout(_casTimers[id]);
  const val = document.getElementById('ci'+id)?.value?.trim() || '';
  // CAS formatı tamamlandıysa (ör: 7664-93-9) hemen sorgula
  if (/^\d{1,7}-\d{2}-\d$/.test(val)) {
    _casTimers[id] = setTimeout(() => onCas(id), 300);
  }
}

async function onCas(id) {
  const casEl = document.getElementById('ci'+id);
  const cas = casEl?.value?.trim();
  if (!cas || cas.length < 5) return;

  // Loading göstergesi
  if (casEl) { casEl.style.borderColor = '#63b3ed'; casEl.title = 'Sorgulanıyor…'; }

  try {
    const r = await fetch(`${API_BASE}/sds/substance/lookup?cas=${encodeURIComponent(cas)}`);
    if (!r.ok) {
      if (casEl) { casEl.style.borderColor = 'var(--danger)'; casEl.title = `API hatası: ${r.status}`; }
      return;
    }
    const data = await r.json();
    if (!data.found) {
      if (casEl) { casEl.style.borderColor = '#f6ad55'; casEl.title = 'CAS bulunamadı'; }
      setTimeout(() => { if(casEl){ casEl.style.borderColor=''; casEl.title=''; }}, 2500);
      return;
    }

    // Alanları doldur — mevcut değer varsa üzerine yaz (kullanıcı görebilsin diye)
    const ni = document.getElementById('ni'+id);
    if (ni && data.name) ni.value = data.name;
    const ec = document.getElementById('ec'+id);
    if (ec && data.ec_no) ec.value = data.ec_no;
    const reach = document.getElementById('reach'+id);
    if (reach && data.reach_no) reach.value = data.reach_no;

    // Başarı göstergesi
    if (casEl) { casEl.style.borderColor = 'var(--safe)'; casEl.title = data.name || ''; }
    setTimeout(() => { if(casEl){ casEl.style.borderColor=''; }}, 1800);

    if (data.hazards) data.hazards.forEach(h => addChip(id, h.h_class, h.h_code));

    // ── SCL — maddeye özel kesme değerleri (Annex VI / KKDİK Ek-1) ────────────
    // Backend: scl = [{h_code:"H314", c_min:2.0, c_max:15.0}, ...]
    // CLPEngine: {H314: 2.0, H315: 0.5, ...}  (h_code → c_min)
    const sclRaw = Array.isArray(data.scl) ? data.scl : [];
    if (sclRaw.length > 0) {
      // Ham listeyi sakla (refinement paneli için tüm c_min/c_max değerleri gerekli)
      _sclRaw[id] = sclRaw;
      // Engine için dict: aynı H kodu varsa en küçük c_min (en erken tetik)
      const sclDict = {};
      sclRaw.forEach(s => {
        if (s.h_code && s.c_min !== undefined) {
          if (sclDict[s.h_code] === undefined || s.c_min < sclDict[s.h_code]) {
            sclDict[s.h_code] = s.c_min;
          }
        }
      });
      _sclMap[id] = sclDict;
      // SCL badge'i göster
      const chips = document.getElementById('chips'+id);
      if (chips) {
        const badge = document.createElement('span');
        badge.style.cssText = 'font-size:9px;color:var(--safe);border:1px solid rgba(0,229,176,.3);border-radius:3px;padding:1px 5px;margin-left:4px';
        const sclDict = _sclMap[id] || {};
        badge.title = 'Maddeye ozgu SCL degerleri: ' + Object.entries(sclDict).map(([k,v])=>`${k}=%${v}`).join(', ');
        badge.textContent = '⚖ SCL';
        chips.appendChild(badge);
      }
    }

    // Seçili aralıkta dropdown'u yenile
    const sel = document.getElementById('csel'+id);
    if (sel && sel.value) onConcChange(id);
    EventBus.emit('SUBSTANCE_FOUND', { id, cas, ...data });
  } catch(e) { console.warn('[CAS lookup]', e); }
}

// ── Manuel konsantrasyon girişi ───────────────────────────────────────────────
// Kabul edilen formatlar: "3.5"  "2-8"  "%5"  "1.5-3"  "≥2"  "≤10"
function parseManualConc(val) {
  const s = val.trim().replace(/\s/g,'').replace('%','').replace(',','.');
  if (!s) return null;
  // Aralık: "2-8" veya "2–8"
  const rangeMatch = s.match(/^(\d+\.?\d*)[–\-](\d+\.?\d*)$/);
  if (rangeMatch) {
    const lo = parseFloat(rangeMatch[1]);
    const hi = parseFloat(rangeMatch[2]);
    if (!isNaN(lo) && !isNaN(hi) && hi >= lo) return { lo, hi };
    return null;
  }
  // Tekil değer: "3.5" → lo=0, hi=3.5 (nokta değer)
  const single = parseFloat(s.replace(/[^0-9.]/g,''));
  if (!isNaN(single) && single >= 0 && single <= 100) return { lo: single, hi: single };
  return null;
}

const _manualDebounce = {};
function onManualConc(id) {
  clearTimeout(_manualDebounce[id]);
  _manualDebounce[id] = setTimeout(async () => {
    const manEl = document.getElementById('cmanual'+id);
    if (!manEl) return;
    const parsed = parseManualConc(manEl.value);
    if (!parsed) {
      manEl.style.borderColor = manEl.value.trim() ? 'var(--danger)' : '';
      return;
    }
    manEl.style.borderColor = 'var(--safe)';
    // Dropdown'u sıfırla
    const sel = document.getElementById('csel'+id);
    if (sel) sel.value = '';
    // Hidden alanları güncelle
    document.getElementById('cmin'+id).value = parsed.lo;
    document.getElementById('cmax'+id).value = parsed.hi;
    // Refinement panelini göster (SCL eşik kontrolü)
    const cas = document.getElementById('ci'+id)?.value?.trim() || '';
    const sclRaw = _sclRaw[id] || [];
    const thresholds = findThresholdsFromSCL(parsed.lo, parsed.hi, sclRaw);
    if (thresholds.length) {
      showRefinementFromAPI(id, parsed.lo, parsed.hi, thresholds);
    } else {
      const crp = document.getElementById('crp'+id);
      if (crp) crp.style.display = 'none';
    }
    setTimeout(() => { manEl.style.borderColor = ''; }, 1500);
  }, 400);
}

// ── Konsantrasyon seçici — backend API ile SCL dahil eşik tespiti ─────────────
async function onConcChange(id) {
  const sel = document.getElementById('csel'+id);
  if (!sel || !sel.value) return;
  const [lo, hi] = sel.value.split('|').map(Number);
  const cas = document.getElementById('ci'+id)?.value?.trim() || '';

  // Chip'lerden tehlike sınıflarını al
  const chips = [...document.querySelectorAll(`#chips${id} .hchip`)];
  const hazardClasses = chips.map(c => c.dataset.hc).filter(Boolean);

  // CAS varsa → backend /refine endpoint'ini çağır (SCL + GCL dahil)
  if (cas && hazardClasses.length > 0) {
    try {
      const params = new URLSearchParams({
        lower: lo, upper: hi,
        hazard_classes: hazardClasses.join(','),
      });
      const r = await fetch(`${API_BASE}/sds/concentration-ranges/${encodeURIComponent(cas)}/refine?${params}`);
      if (r.ok) {
        const data = await r.json();
        // Backend split_points döndürüyorsa refinement göster
        // Backend: { refinements: [{threshold, question, below, above, classification_changes}] }
        const refs = data.refinements || [];
        const changing = refs.filter(r => r.classification_changes);
        if (changing.length > 0) {
          // Her kritik eşiği threshold formatına çevir
          const thresholds = changing.map(r => ({
            thr: r.threshold,
            question: r.question || '',
            below: r.below || {},
            above: r.above || {},
            items: (r.above?.active_classes || []).map(c => ({
              code: r.above?.h_codes?.[0] || '',
              label: c,
            })),
          }));
          showRefinementFromAPI(id, lo, hi, thresholds);
          return;
        } else if (refs.length > 0) {
          // Eşik var ama sınıf değişmiyor — sadece kaydet
          saveConc(id, lo, hi);
          return;
        }
      }
    } catch(e) {
      console.warn('[ConcChange] API hatası, fallback GCL kullanılıyor:', e);
    }
  }

  // Fallback: CAS yoksa veya API başarısız olursa
  const hazards = chips.map(c => ({ h_class: c.dataset.hc, h_code: c.dataset.code }));

  // Önce SCL ham listesine bak (CAS lookup'tan geldiyse)
  const rawScl = _sclRaw[id] || [];
  const sclThresholds = findThresholdsFromSCL(lo, hi, rawScl);

  if (sclThresholds.length > 0) {
    // SCL eşikleri bulundu — API formatına çevir ve göster
    showRefinementFromAPI(id, lo, hi, sclThresholds);
  } else {
    // Son çare: GCL tablosu
    const thresholds = findThresholds(lo, hi, hazards);
    if (thresholds.length > 0) {
      showRefinement(id, lo, hi, thresholds);
    } else {
      saveConc(id, lo, hi);
      document.getElementById('crp'+id).style.display = 'none';
    }
  }
}

// SCL ham listesinden (c_min/c_max) aralık içindeki eşikleri çıkar
// Döndürür: showRefinementFromAPI formatında threshold dizisi
function findThresholdsFromSCL(lo, hi, sclRaw) {
  if (!sclRaw.length) return [];

  // Aralık içinde kalan tüm c_min değerlerini bul
  const thrMap = new Map(); // c_min → { below:[], above:[] }

  for (const s of sclRaw) {
    const thr = s.c_min;
    if (thr === undefined || thr <= lo || thr >= hi) continue; // sınır dışı

    if (!thrMap.has(thr)) thrMap.set(thr, { below: [], above: [] });
    const entry = thrMap.get(thr);

    // Bu eşiğin ÜSTÜNDE hangi sınıf geçerli?
    entry.above.push({ h_code: s.h_code, h_class: s.h_class });
  }

  // Eşiğin ALTINDA hangi sınıflar geçerli? → bir sonraki c_min katmanı (varsa)
  // En az bir eşik içeride olmalı
  if (!thrMap.size) return [];

  // thrMap'i sıralı listeye çevir
  const sorted = [...thrMap.entries()].sort((a,b) => a[0]-b[0]);

  return sorted.map(([thr, sides], idx) => {
    const aboveHCodes  = [...new Set(sides.above.map(x => x.h_code))];
    const aboveClasses = [...new Set(sides.above.map(x => x.h_class))];

    // Eşiğin altındaki sınıflar: bir önceki katmanın above'u (yoksa lo aralığındaki)
    const prevAbove = idx > 0 ? sorted[idx-1][1].above : [];
    const belowClasses = prevAbove.length
      ? [...new Set(prevAbove.map(x => x.h_class))]
      : ['Sınıflandırılmamış'];
    const belowHCodes = prevAbove.length
      ? [...new Set(prevAbove.map(x => x.h_code))]
      : [];

    return {
      thr,
      question: `%${thr} kritik eşiği bu aralığın içinde — formulasyon hangi tarafa düşüyor?`,
      above: { h_codes: aboveHCodes, active_classes: aboveClasses, source: 'KKDİK Ek-1 / CLP (AT) 1272/2008 Annex VI — SCL' },
      below: { h_codes: belowHCodes, active_classes: belowClasses },
      classification_changes: true,
    };
  });
}

function findThresholds(lo, hi, hazards) {
  // H kodu bazlı GCL eşik tablosu — CLP Annex I Tablo 3.x
  const GCL_BY_HCODE = {
    'H314':[[1,'Skin Corr. 1 başlar'],[5,'Skin Irrit. 2 başlar']],
    'H318':[[1,'Eye Dam. 1 başlar'],[3,'Eye Irrit. 2 başlar']],
    'H315':[[10,'Skin Irrit. 2 başlar']],
    'H319':[[10,'Eye Irrit. 2 başlar']],
    'H317':[[1,'Deri Duyarlaştırma başlar']],
    'H334':[[0.1,'Solunum Duyarlaştırma başlar']],
    'H340':[[0.1,'Mutajenisite Kat.1 başlar'],[1,'Mutajenisite Kat.2 başlar']],
    'H350':[[0.1,'Kanserojenite Kat.1 başlar'],[1,'Kanserojenite Kat.2 başlar']],
    'H360':[[0.1,'Üreme Toks. Kat.1 başlar'],[1,'Üreme Toks. Kat.2 başlar']],
    'H370':[[10,'STOT SE 1 başlar']],
    'H371':[[10,'STOT SE 2 başlar']],
    'H335':[[20,'STOT SE 3 başlar']],
    'H336':[[20,'STOT SE 3 başlar']],
    'H372':[[1,'STOT RE 1 başlar']],
    'H373':[[10,'STOT RE 2 başlar']],
    'H300':[[1,'Akut Toks. Kat.1-2 başlar']],
    'H301':[[1,'Akut Toks. Kat.3 başlar']],
    'H302':[[5,'Akut Toks. Kat.4 başlar']],
    'H310':[[1,'Akut Toks. Kat.1-2 başlar']],
    'H330':[[1,'Akut Toks. Kat.1-2 başlar']],
    'H400':[[0.1,'Sucul Akut 1 başlar']],
    'H410':[[0.1,'Sucul Kronik 1 başlar']],
    'H411':[[1,'Sucul Kronik 2 başlar']],
    'H412':[[10,'Sucul Kronik 3 başlar']],
  };

  const found = new Map(); // thr → label
  for (const h of hazards) {
    const code = (h.h_code || '').replace(/[*\s]/g,'').substring(0,4);
    const entries = GCL_BY_HCODE[code] || [];
    for (const [thr, label] of entries) {
      if (thr > lo && thr < hi) {
        if (!found.has(thr)) found.set(thr, []);
        found.get(thr).push({ code, label });
      }
    }
  }
  return [...found.entries()]
    .sort((a,b) => a[0]-b[0])
    .map(([thr, items]) => ({ thr, items }));
}

function showRefinement(id, lo, hi, thresholds) {
  const crp = document.getElementById('crp'+id);
  if (!crp) return;
  const { thr, items } = thresholds[0];
  const hcodes = [...new Set(items.map(i => i.code))];
  const labels = [...new Set(items.map(i => i.label.replace(' başlar','')))]
    .join(', ');

  // Alt sub-aralık: lo % → (thr-epsilon) %  → tehlike sınıfı DEĞİŞMEZ
  // Üst sub-aralık: thr % → hi %            → tehlike sınıfı DEĞİŞİR
  const safeHi  = thr % 1 === 0 ? thr - 1 : Math.floor(thr);   // görsel üst sınır (tamsayı)
  const dangerLo = thr;

  const hcodeBadges = hcodes.map(c =>
    `<span style="display:inline-block;background:rgba(255,107,107,.18);border:1px solid rgba(255,107,107,.4);color:var(--danger);border-radius:3px;padding:1px 6px;font-size:10px;font-family:var(--mono);font-weight:700">${c}</span>`
  ).join(' ');

  crp.style.display = 'block';
  crp.innerHTML = `
    <div class="crp-head">
      ⚠️ <b>Kritik eşik %${thr} bu aralığın içinde!</b>
      <div style="font-size:10px;margin-top:3px;opacity:.85">
        ${labels} — formulasyonunuz hangi aralığa giriyor?
      </div>
    </div>
    <div style="padding:10px 10px 6px;background:var(--bg3);font-size:10px;color:var(--text3);border-bottom:1px solid var(--border)">
      Lütfen formulasyonunuzun konsantrasyon aralığını seçin:
    </div>
    <div class="crp-btns">
      <button class="crp-btn safe-border" onclick="saveConc(${id},${lo},${thr}-0.001)">
        <div style="font-size:13px;font-weight:800;color:var(--safe);margin-bottom:4px">
          %${lo} – %${safeHi}
        </div>
        <div style="font-size:10px;color:var(--text2);margin-bottom:4px">Tehlikesiz aralık</div>
        <div style="font-size:9px;color:var(--text3)">${hcodes.join(', ')} uygulanmaz</div>
      </button>
      <button class="crp-btn danger-border" onclick="saveConc(${id},${dangerLo},${hi})">
        <div style="font-size:13px;font-weight:800;color:var(--danger);margin-bottom:4px">
          %${dangerLo} – %${hi}
        </div>
        <div style="font-size:10px;color:var(--text2);margin-bottom:4px">Tehlike sınıfı değişir</div>
        <div>${hcodeBadges}</div>
      </button>
    </div>
    <div style="padding:6px 10px;font-size:9px;color:var(--text3);background:var(--bg3);border-top:1px solid var(--border)">
      ℹ KKDİK Ek-2 / CLP (AT) 1272/2008 — eşik değeri %${thr}
    </div>`;
}

// ── API'den gelen SCL/GCL eşiklerini göster ────────────────────────────────────
function showRefinementFromAPI(id, lo, hi, thresholds) {
  const crp = document.getElementById('crp' + id);
  if (!crp || !thresholds.length) return;

  // En kritik (en düşük) eşiği seç
  const t = thresholds.reduce((min, x) => x.thr < min.thr ? x : min, thresholds[0]);
  const thr = t.thr;

  // Üst ("above") tarafa düşen H kodları ve sınıf etiketleri
  const aboveHCodes  = (t.above?.h_codes  || []).filter(Boolean);
  const aboveClasses = (t.above?.active_classes || []).filter(Boolean);
  const belowHCodes  = (t.below?.h_codes  || []).filter(Boolean);
  const belowClasses = (t.below?.active_classes || []).filter(Boolean);

  // H kodu badge'leri
  const makeBadges = (codes, color) => codes.map(c =>
    `<span style="display:inline-block;background:rgba(${color},.18);border:1px solid rgba(${color},.4);color:var(${color==='255,107,107'?'--danger':'--safe'});border-radius:3px;padding:1px 6px;font-size:10px;font-family:var(--mono);font-weight:700">${c}</span>`
  ).join(' ');

  const dangerBadges = makeBadges(aboveHCodes, '255,107,107');
  const safeBadges   = belowHCodes.length
    ? makeBadges(belowHCodes, '0,229,176')
    : `<span style="font-size:10px;color:var(--safe)">Sınıflandırılmamış</span>`;

  // Görsel sınır değerleri
  const safeHi   = thr % 1 === 0 ? thr - 1 : parseFloat(thr.toFixed(2));
  const dangerLo = thr;

  // Soru metni: API'den geliyorsa kullan, yoksa default
  const questionText = t.question
    || `Formulasyonunuzun %${lo}–%${hi} aralığındaki konsantrasyonu %${thr} eşiğini geçiyor mu?`;

  // Eşik kaynağı (SCL mi GCL mi)
  const sourceNote = t.above?.source
    ? `⚖ Kaynak: ${t.above.source}`
    : `ℹ KKDİK Ek-2 / CLP (AT) 1272/2008 — kritik eşik %${thr}`;

  crp.style.display = 'block';
  crp.innerHTML = `
    <div class="crp-head">
      ⚠️ <b>Kritik eşik %${thr} bu aralığın içinde!</b>
      <div style="font-size:10px;margin-top:3px;opacity:.85">${questionText}</div>
    </div>
    <div style="padding:10px 10px 6px;background:var(--bg3);font-size:10px;color:var(--text3);border-bottom:1px solid var(--border)">
      Lütfen formulasyonunuzun konsantrasyon aralığını seçin:
    </div>
    <div class="crp-btns">
      <button class="crp-btn safe-border" onclick="saveConc(${id},${lo},${safeHi})">
        <div style="font-size:13px;font-weight:800;color:var(--safe);margin-bottom:4px">
          %${lo} – %${safeHi}
        </div>
        <div style="font-size:10px;color:var(--text2);margin-bottom:4px">
          ${belowClasses.length ? belowClasses.join(' / ') : 'Tehlikesiz aralık'}
        </div>
        <div>${safeBadges}</div>
      </button>
      <button class="crp-btn danger-border" onclick="saveConc(${id},${dangerLo},${hi})">
        <div style="font-size:13px;font-weight:800;color:var(--danger);margin-bottom:4px">
          %${dangerLo} – %${hi}
        </div>
        <div style="font-size:10px;color:var(--text2);margin-bottom:4px">
          ${aboveClasses.length ? aboveClasses.join(' / ') : 'Tehlike sınıfı değişir'}
        </div>
        <div>${dangerBadges}</div>
      </button>
    </div>
    ${thresholds.length > 1 ? `
    <div style="padding:6px 10px;background:var(--bg3);border-top:1px solid var(--border)">
      ${thresholds.slice(1).map(tx => {
        const txHCodes = (tx.above?.h_codes||[]).join(', ');
        return `<div style="font-size:9px;color:var(--text3);padding:2px 0">
          ▶ %${tx.thr} eşiğinde de sınıf değişimi var${txHCodes?' ('+txHCodes+')':''}
        </div>`;
      }).join('')}
    </div>` : ''}
    <div style="padding:6px 10px;font-size:9px;color:var(--text3);background:var(--bg3);border-top:1px solid var(--border)">
      ${sourceNote}
    </div>`;
}

function saveConc(id, lo, hi) {
  document.getElementById('cmin'+id).value = lo;
  document.getElementById('cmax'+id).value = hi;
  const crp = document.getElementById('crp'+id);
  if (crp) crp.style.display = 'none';
  const sel = document.getElementById('csel'+id);
  if (sel) sel.style.borderColor = 'var(--safe)';
  setTimeout(() => { if(sel) sel.style.borderColor=''; }, 1500);
}

// ── Bileşen okuyucu ───────────────────────────────────────────────────────────
function getComps() {
  return [...document.querySelectorAll('.cw')].map(w => {
    const cas  = w.querySelector('.ci')?.value?.trim() || '';
    const name = w.querySelector('.ni')?.value?.trim() || '';
    const minEl = w.querySelector('.kimin');
    const maxEl = w.querySelector('.kimax');
    let concMin = parseFloat(minEl?.value) || 0;
    let concMax = parseFloat(maxEl?.value) || null;
    if (!concMin && (!concMax || concMax === 0)) {
      const sel = w.querySelector('.conc-sel');
      if (sel && sel.value) {
        const parts = sel.value.split('|').map(Number);
        if (parts.length === 2) { concMin = parts[0]; concMax = parts[1]; }
      }
      // Manuel giriş alanından doğrudan oku (debounce henüz tetiklenmediyse)
      if (!concMin && (!concMax || concMax === 0)) {
        const manEl = w.querySelector('.conc-manual');
        if (manEl && manEl.value.trim()) {
          const parsed = parseManualConc(manEl.value);
          if (parsed) { concMin = parsed.lo; concMax = parsed.hi; }
        }
      }
    }
    const conc = concMax != null && concMax > 0 ? concMax : concMin;
    const hazards = [...w.querySelectorAll('.hchip')].map(c => ({ h_class: c.dataset.hc, h_code: c.dataset.code }));
    const ec    = w.querySelector('.ec-input')?.value?.trim() || '';
    const reach = w.querySelector('.reach-input')?.value?.trim() || '';
    const mf    = parseFloat(w.querySelector('.mf-input')?.value) || 1;
    // Bileşen ID'sini DOM'dan al (cw{id} → id)
    const cwId  = parseInt((w.id || '').replace('cw','')) || 0;
    // SCL: maddeye özel kesme değerleri — Öncelik 1 (GCL'yi ezer)
    const scl   = _sclMap[cwId] || {};
    return { cas, name, conc, concMin, concMax, hazards, ec, reach, m_factors:{ acute: mf, chronic: mf }, scl };
  }).filter(c => c.cas || c.name);
}

// ── Ana hesaplama tetikleyici ─────────────────────────────────────────────────
function doCalculate() {
  const comps = getComps();
  if (!comps.length) { showError('En az bir bileşen girin.'); return; }
  const form   = document.getElementById('pform')?.value || 'liquid';
  const userFP = parseFloat(document.getElementById('tf_fp')?.value) || null;

  // Bölüm 9 — Fiziksel ve Kimyasal Özellikler (kullanıcı girdiyse teorik hesabı ezer)
  const testData = {};
  const g = id => document.getElementById(id)?.value?.trim();
  const n = id => parseFloat(document.getElementById(id)?.value);

  // Metin alanları
  if (g('tf_appearance')) testData.appearance  = g('tf_appearance');
  if (g('tf_odor'))       testData.odor        = g('tf_odor');
  if (g('tf_evap'))       testData.evap_rate   = g('tf_evap');
  if (g('tf_flam_sg'))    testData.flam_sg     = g('tf_flam_sg');
  if (g('tf_expl'))       testData.explosive   = g('tf_expl');
  if (g('tf_oxid'))       testData.oxidizing   = g('tf_oxid');
  if (g('tf_sol_other'))  testData.sol_other   = g('tf_sol_other');

  // Sayısal alanlar (motor değerlerini ezer)
  const tfDens   = n('tf_density');
  const tfBP     = n('tf_bp');
  const tfPH     = n('tf_ph');
  const tfVisc   = n('tf_visc');
  const tfSol    = n('tf_sol');
  const tfMP     = n('tf_mp');
  const tfAIT    = n('tf_ait');
  const tfDecomp = n('tf_decomp');
  const tfLogKow = n('tf_logkow');
  const tfOdorTh = n('tf_odor_thresh');

  if (!isNaN(tfDens)   && tfDens > 0)   testData.density          = tfDens;
  if (!isNaN(tfBP))                     testData.boiling_point     = tfBP;
  if (!isNaN(tfPH)     && tfPH >= 0)    testData.ph                = tfPH;
  if (!isNaN(tfVisc)   && tfVisc > 0)   testData.viscosity         = tfVisc;
  if (!isNaN(tfSol)    && tfSol >= 0)   testData.solubility        = tfSol;
  if (!isNaN(tfMP))                     testData.melting_point     = tfMP;
  if (!isNaN(tfAIT)    && tfAIT > 0)    testData.auto_ignition     = tfAIT;
  if (!isNaN(tfDecomp) && tfDecomp > 0) testData.decomp_temp       = tfDecomp;
  if (!isNaN(tfLogKow))                 testData.log_kow           = tfLogKow;
  if (!isNaN(tfOdorTh) && tfOdorTh > 0) testData.odor_threshold   = tfOdorTh;

  EventBus.emit('PIPELINE_START', { comps, form, userFP, testData });
}

// ── Pipeline orkestratörü ─────────────────────────────────────────────────────
function initPipeline() {
  EventBus.on('PIPELINE_START', ({ comps, form, userFP, testData }) => {
    // Tüm engine'leri paralel tetikle
    EventBus.emit('CLP_CALCULATE',      { comps });
    EventBus.emit('STOT_CALCULATE',     { comps });
    EventBus.emit('ECO_CALCULATE',      { comps });
    EventBus.emit('EUH_CALCULATE',      { comps });
    EventBus.emit('PHYSICAL_CALCULATE', { comps, form, userFP, testData: testData || {} });
    // State'e comps kaydet
    if (typeof StateStore !== 'undefined') StateStore.set('comps', comps);
  });

  // H kodları hazır olunca P kodu ve diğerleri zaten otomatik tetiklenir
  // (PCodeEngine, TransportEngine, PPEEngine H_CODES_READY'yi dinliyor)

  // Tüm sonuçları topla ve render et
  // Not: pcodes/transport/ppe renderAll içinde allH ile hesaplanır (doğru sıra için)
  const _state = {};
  const REQUIRED = ['clp','stot','eco','euh','phys'];

  function tryRender() {
    if (REQUIRED.every(k => _state[k])) renderAll(_state);
  }

  EventBus.on('H_CODES_READY',    r => { _state.clp = r; tryRender(); });
  EventBus.on('STOT_READY',       r => { _state.stot = r; tryRender(); });
  EventBus.on('ECO_READY',        r => { _state.eco = r; tryRender(); });
  EventBus.on('EUH_READY',        r => { _state.euh = r; tryRender(); });
  EventBus.on('PHYSICAL_READY',   r => { _state.phys = r; tryRender(); });

  EventBus.on('PIPELINE_START', () => {
    REQUIRED.forEach(k => delete _state[k]);
  });
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderAll(s) {
  const el = document.getElementById('results');
  if (!el) return;
  const { clp, stot, eco, euh, phys } = s;

  // Tüm H kodlarını birleştir (tüm motorlardan)
  const allHRaw = [...new Set([
    ...(clp.hCodes || []),
    ...(stot.h_codes || []),
    ...(eco.h_codes || []),
    ...(phys.results||[]).map(r => r.h || r.h_code),
  ])].filter(Boolean).map(c => c.replace(/[*\s]/g,'').substring(0,4));

  // Motorlar arası dominance — CLPEngine DOMINANCE tablosunu uygula
  // Örn: EcoEngine H410+H400 üretirse → H400 süpürülür
  //      STOTEngine H372 + CLPEngine H373 → H373 süpürülür
  const allH = [...allHRaw];
  if (typeof CLPEngine !== 'undefined' && CLPEngine.DOMINANCE) {
    Object.entries(CLPEngine.DOMINANCE).forEach(([dominant, subs]) => {
      if (allH.includes(dominant)) {
        subs.forEach(sub => {
          const i = allH.indexOf(sub);
          if (i > -1) allH.splice(i, 1);
        });
      }
    });
  }

  // Sinyal kelimesi — birleşik H kodlarından yeniden hesapla
  const _dH = CLPEngine.DANGER_H;
  const _wH = CLPEngine.WARNING_H;
  const combinedSignal = allH.some(c => _dH && _dH.has(c)) ? 'Danger'
    : allH.some(c => _wH && _wH.has(c)) ? 'Warning' : 'None';

  // ── P Kodu / Taşımacılık / KKD — TÜM H kodlarıyla hesapla ──────────────
  // (H_CODES_READY sadece CLP kodlarını içerir; fiziksel H225, H304 vb. eksik kalırdı)
  const usage = document.getElementById('pusage')?.value || 'industrial';
  const pcodes   = PCodeEngine.calculate({ hCodes: allH, signal: combinedSignal, usage });
  const transport = TransportEngine.classify(allH);
  const ppe       = PPEEngine.select(allH);

  let h = '';

  // ── Banner ────────────────────────────────────────────────────────────────
  if (allH.length > 0) {
    const sigClass = combinedSignal === 'Danger'  ? 'signal-danger'
                   : combinedSignal === 'Warning' ? 'signal-warning' : 'signal-none';
    const sigLabel = combinedSignal === 'Danger'  ? '🔴 DANGER'
                   : combinedSignal === 'Warning' ? '🟡 WARNING'
                   : '⚪ Uyarı kelimesi yok (CLP Annex III)';

    // Piktogramlar — tüm H kodlarından (dominance uygulanmış) yeniden hesapla
    const combinedPics = CLPEngine.getGhsCodes ? CLPEngine.getGhsCodes(allH) : (clp.pictograms || []);

    // Pill rengi
    const pillClass = c => (_dH && _dH.has(c)) ? 'hp-danger'
                         : (_wH && _wH.has(c)) ? 'hp-warn' : 'hp-info';

    h += `<div class="result-banner">
      <div class="${sigClass}" style="margin-bottom:8px">${sigLabel}</div>
      <div class="hcode-pills">${allH.map(c => `<span class="hpill ${pillClass(c)}">${c}</span>`).join('')}</div>
      <div class="pictogram-row">${combinedPics.map(g => `<div class="ghs-icon"><div class="sym">${GHS_DATA[g]?.sym||'?'}</div><div class="lbl">${g}</div></div>`).join('')}</div>
      ${combinedSignal === 'None' ? `<div style="font-size:10px;color:var(--text3);margin-top:6px">ℹ H412/H413 gibi kodlar etiket üzerinde piktogram ve uyarı kelimesi gerektirmez.</div>` : ''}
    </div>`;
  }

  // ── Bölüm 2.1 — Sağlık Tehlikeleri ─────────────────────────────────────
  const healthH = (clp.hCodes||[]).filter(c => !['H224','H225','H226','H228'].includes(c) && !(phys.results||[]).some(r=>(r.h||r.h_code)===c));
  if (healthH.length) {
    h += `<div class="r-title">🧪 Bölüm 2.1 — Sağlık Tehlikeleri</div>`;
    healthH.forEach((code,i) => {
      const _dH = CLPEngine.DANGER_H || DANGER_H;
      const _wH = CLPEngine.WARNING_H;
      const cls = _dH.has(code) ? 'danger' : 'warning';
      const tag = _dH.has(code)
        ? '<span class="sbadge danger">DANGER</span>'
        : (_wH && _wH.has(code)
            ? '<span class="sbadge warning">WARNING</span>'
            : '<span class="sbadge" style="background:rgba(100,181,246,.1);color:var(--info)">H-beyanı</span>');

      // cutoffUsed: CLPEngine'den gelen gerçek eşik (SCL varsa SCL, yoksa GCL)
      const cu = clp.cutoffUsed && clp.cutoffUsed[code];
      const cutoffVal  = cu ? cu.value : CLPEngine.CUTOFFS[code];
      const cutoffSrc  = cu ? cu.source : 'GCL';
      const isSCL      = cutoffSrc === 'SCL';
      const cutoffNote = cutoffVal !== undefined
        ? ` · ${isSCL
            ? `<span style="color:var(--safe);font-weight:700">SCL</span> ≥ %${cutoffVal} <span style="opacity:.6;font-size:9px">(Annex VI maddeye özgü)</span>`
            : `GCL ≥ %${cutoffVal}`}`
        : '';

      h += `<div class="ecard ${cls}" style="animation-delay:${i*.03}s">
        <div class="ecard-head"><span class="ecard-code">${code}</span>${tag}</div>
        <div class="ecard-source">KKDİK Ek-2 / CLP (AT) 1272/2008${cutoffNote}</div>
      </div>`;
    });
  }

  // ── Fiziksel Tehlikeler ──────────────────────────────────────────────────
  if ((phys.results||[]).length) {
    h += `<div class="r-title">⚡ Fiziksel Tehlikeler</div>`;
    phys.results.forEach((p,i) => {
      const code = p.h || p.h_code;
      const cls = p.signal === 'Danger' ? 'danger' : 'warning';
      h += `<div class="ecard ${cls}" style="animation-delay:${i*.03}s">
        <div class="ecard-head"><span class="ecard-code">${code}</span><span class="ecard-label">${p.label||''}</span></div>
        ${p.source ? `<div class="ecard-source">📦 ${p.source}</div>` : ''}
      </div>`;
    });
  }

  // ── Bölüm 9 — Fiziksel Özellikler (kompakt özet + modal) ────────────────
  const tp = phys.theoProps;
  _lastTheoProps = tp || null;   // modal için kaydet

  if (tp) {
    const coverageColor = tp.coverage >= 80 ? '#68d391' : tp.coverage >= 50 ? '#f6ad55' : '#fc8181';
    const measuredCount = ['density','boiling_point','flash_point','lel','ph','viscosity'].filter(p => tp[p]?.measured).length;

    // Kompakt chip yardımcısı
    function chip(label, d, unit = '') {
      if (!d || (d.value === null || d.value === undefined)) {
        return `<div class="phys-chip"><div class="phys-chip-label">${label}</div><div class="phys-chip-val" style="color:var(--text3);font-size:10px">—</div></div>`;
      }
      const badge = d.measured
        ? `<span style="font-size:8px;color:#68d391">✓</span> `
        : (d.error ? `<span style="font-size:8px;color:#f6ad55">±%${d.error.pct}</span> ` : '');
      return `<div class="phys-chip">
        <div class="phys-chip-label">${label}</div>
        <div class="phys-chip-val">${badge}${d.value}${unit ? ' <span style="font-size:9px;font-weight:400;color:var(--text3)">' + unit + '</span>' : ''}</div>
      </div>`;
    }

    const headerBadge = measuredCount > 0
      ? `<span style="font-size:9px;padding:2px 7px;border-radius:10px;background:rgba(104,211,145,.15);color:#68d391">${measuredCount} ölçülen değer</span>`
      : tp.coverage > 0
      ? `<span style="font-size:9px;padding:2px 7px;border-radius:10px;background:rgba(99,179,237,.1);color:${coverageColor}">DB kapsama %${tp.coverage}</span>`
      : '';

    h += `<div class="r-title">🧮 Bölüm 9 — Fiziksel Özellikler</div>
    <div class="ecard info" style="padding:10px 12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <span style="font-size:10px;font-weight:700;color:#63b3ed;font-family:var(--mono)">FİZİKSEL ÖZELLİKLER</span>
        ${headerBadge}
      </div>
      <div class="phys-summary">
        ${chip('Parlama Noktası', tp.flash_point, '°C')}
        ${chip('Kaynama Noktası', tp.boiling_point, '°C')}
        ${chip('Yoğunluk', tp.density, 'g/cm³')}
        ${chip('LEL', tp.lel, '%v/v')}
        ${chip('UEL', tp.uel, '%v/v')}
        ${chip('pH', tp.ph)}
      </div>
      <button onclick="openPhysModal()"
        style="width:100%;margin-top:6px;padding:7px;border-radius:6px;border:1px dashed var(--border2);background:none;color:var(--text3);font-size:10px;cursor:pointer;font-family:var(--mono)"
        onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'"
        onmouseout="this.style.borderColor='var(--border2)';this.style.color='var(--text3)'">
        📋 Tüm Özellikler — Bölüm 9.1 (24 parametre) →
      </button>
    </div>`;
  }

  // ── STOT RE ──────────────────────────────────────────────────────────────
  if ((stot.results||[]).length) {
    h += `<div class="r-title">🫁 STOT RE — Tekrarlı Maruziyet</div>`;
    stot.results.forEach((s,i) => {
      const cls = s.signal === 'Danger' ? 'danger' : 'warning';
      h += `<div class="ecard ${cls}" style="animation-delay:${i*.03}s">
        <div class="ecard-head"><span class="ecard-code">${s.h}</span><span class="ecard-label">${s.h_class} — ${s.organ}</span></div>
        <div class="ecard-source">${s.reason}</div>
      </div>`;
    });
  }

  // ── EUH Kodları ──────────────────────────────────────────────────────────
  if ((euh.codes||[]).length) {
    h += `<div class="r-title">📋 EUH İfadeleri</div>`;
    (euh.details||[]).forEach((d,i) => {
      const cls = d.type === 'auto' ? 'danger' : 'info';
      h += `<div class="ecard ${cls}" style="animation-delay:${i*.03}s">
        <div class="ecard-head">
          <span class="ecard-code">${d.code}</span>
          <span class="sbadge ${d.type==='auto'?'danger':'warning'}">${d.type==='auto'?'Zorunlu':'Tavsiye'}</span>
        </div>
        <div class="ecard-label" style="font-size:11px;margin:4px 0;color:var(--text2)">${d.text||''}</div>
        <div class="ecard-source">Kaynak: ${d.source||''}</div>
      </div>`;
    });
  }

  // ── Ekolojik ─────────────────────────────────────────────────────────────
  if (eco.aquatic) {
    h += `<div class="r-title">🌿 Bölüm 12 — Ekolojik</div>`;
    h += `<div class="ecard warning">
      <div class="ecard-head"><span class="ecard-code">${eco.aquatic.h}</span><span class="ecard-label">${eco.aquatic.cls}</span></div>
      <div class="ecard-source">${eco.aquatic.formula}</div>
    </div>`;
  }

  // ── P Kodları ─────────────────────────────────────────────────────────────
  if ((pcodes.codes||[]).length) {
    h += `<div class="r-title">🛡 Bölüm 2.2 — P Kodları (${pcodes.total} adet)</div>`;
    h += `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px">`;
    (pcodes.codes||[]).forEach(code => {
      h += `<span style="background:rgba(100,181,246,.1);border:1px solid rgba(100,181,246,.2);color:var(--info);border-radius:4px;padding:2px 7px;font-family:var(--mono);font-size:10px">${code}</span>`;
    });
    h += `</div>`;
  }

  // ── Taşımacılık ──────────────────────────────────────────────────────────
  h += `<div class="r-title">🚛 Bölüm 14 — Taşımacılık</div>`;
  if (transport.not_regulated) {
    h += `<div class="ecard info"><div class="ecard-head"><span class="ecard-code">Tehlikeli değil</span></div><div class="ecard-source">${transport.note}</div></div>`;
  } else {
    h += `<div class="transport-grid">
      <div class="transport-card"><div class="t-mode">🚚 Kara (ADR)</div><div class="t-un">${transport.road?.un||'—'}</div><div class="t-class">Sınıf ${transport.road?.class||'—'} · PG ${transport.road?.pg||'—'}</div></div>
      <div class="transport-card"><div class="t-mode">🚢 Deniz (IMDG)</div><div class="t-un">${transport.sea?.un||'—'}</div><div class="t-class">Sınıf ${transport.sea?.class||'—'} · PG ${transport.sea?.pg||'—'}</div></div>
      <div class="transport-card"><div class="t-mode">✈️ Hava (IATA)</div><div class="t-un">${transport.air?.un||'—'}</div><div class="t-class">Sınıf ${transport.air?.class||'—'} · PG ${transport.air?.pg||'—'}</div></div>
    </div>`;
    if (transport.road?.note) h += `<div class="warn-box" style="margin-top:6px">⚠ ${transport.road.note}</div>`;
  }

  // ── KKD / Bölüm 8 ────────────────────────────────────────────────────────
  const hasPPE = Object.values(ppe).some(arr => arr.length > 0);
  if (hasPPE) {
    h += `<div class="r-title">🧤 Bölüm 8 — Kişisel Koruyucu Donanım</div>`;
    const cats = [
      ['respiratory','🌬️ Solunum'], ['hands','🧤 El'],
      ['eyes','👓 Göz/Yüz'], ['body','🦺 Vücut'],
    ];
    cats.forEach(([key, label]) => {
      if (!(ppe[key]||[]).length) return;
      h += `<div class="ppe-category"><div class="ppe-cat-title">${label}</div>`;
      ppe[key].forEach(item => { h += `<div class="ppe-item">${item.ppe}</div>`; });
      h += `</div>`;
    });
  }

  // PDF butonu — sonuçların üstüne ekle
  const pdfBar = `<div style="display:flex;justify-content:flex-end;margin-bottom:10px">
    <button onclick="generatePDF()"
      style="background:linear-gradient(135deg,#e53e3e,#c53030);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:var(--mono)"
      onmouseover="this.style.opacity='.85'" onmouseout="this.style.opacity='1'">
      📄 PDF Oluştur
    </button>
  </div>`;
  el.innerHTML = pdfBar + h;

  // Son hesaplama durumunu sakla
  _lastCalcState = {
    allH, combinedSignal, transport, pcodes, ppe,
    euh: s.euh,
    phys: s.phys,
    clp: s.clp,
    eco: s.eco,
    comps: getComps(),
  };
}

function showError(msg) {
  document.getElementById('results').innerHTML = `<div class="warn-box">⚠ ${msg}</div>`;
}

// ── Başlatma ──────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  // Engine'leri başlat
  CLPEngine.init();
  PCodeEngine.init();
  EcoEngine.init();
  STOTEngine.init();
  EUHEngine.init();
  TransportEngine.init();
  PPEEngine.init();
  PhysicalEngine.init();

  // Pipeline orkestratörünü başlat
  initPipeline();

  // İlk bileşeni ekle
  addComp();

  console.log('[SDSPass v2] Modüler pipeline hazır — EventBus.debug() ile olayları izle');
});
</script>

<!-- ══ FİZİKSEL ÖZELLİKLER MODAL ══════════════════════════════════════════ -->
<div class="phys-modal-overlay" id="physModalOverlay" onclick="if(event.target===this)closePhysModal()">
  <div class="phys-modal">
    <div class="phys-modal-head">
      <h3>📋 Bölüm 9.1 — Fiziksel ve Kimyasal Özellikler</h3>
      <button class="phys-modal-close" onclick="closePhysModal()">✕</button>
    </div>
    <div class="phys-modal-body" id="physModalBody">
      <div style="color:var(--text3);font-size:11px;padding:20px 0;text-align:center">Önce hesaplama yapın</div>
    </div>
  </div>
</div>

<script>
// ── Fiziksel Özellikler Modal ─────────────────────────────────────────────────
let _lastTheoProps = null;

// ── Son hesaplama sonuçları (PDF için) ────────────────────────────────────────
let _lastCalcState = null;

function openPhysModal() {
  const tp = _lastTheoProps;
  const body = document.getElementById('physModalBody');
  if (!body) return;

  // Tüm SDS 9.1 satırları — sıra PDF ile aynı
  const NA = '<span class="pm-na">Uygun veri yoktur</span>';

  function fmtVal(d, unit = '') {
    if (!d || d.value === null || d.value === undefined) return NA;
    const vs = `${d.value}${unit ? ' ' + unit : ''}`;
    const badge = d.measured
      ? `<span class="pm-badge-meas">✓ Ölçülen</span>`
      : (d.error ? `<span class="pm-badge-err">±${d.error.abs} (±%${d.error.pct})</span>` : '');
    const meta = d.method || d.standard
      ? `<div class="pm-meta">${[d.method, d.standard].filter(Boolean).join(' · ')}</div>`
      : '';
    return `<div><span class="pm-val">${vs}</span>${badge}</div>${meta}`;
  }

  function fmtStr(d) {
    if (!d || !d.value) return NA;
    return `<span class="pm-val">${d.value}</span><span class="pm-badge-meas">✓ Beyan</span>`;
  }

  // SDS 9.1 yasal sıralama (REACH Ek II / KKDİK Ek-2)
  const rows = [
    ['Görünüm (fiziksel hal, renk)',      tp?.appearance   ? fmtStr(tp.appearance)                          : NA],
    ['Koku',                              tp?.odor         ? fmtStr(tp.odor)                                : NA],
    ['Koku eşiği',                        tp?.odor_threshold ? fmtVal(tp.odor_threshold, 'ppm')             : NA],
    ['pH değeri',                         fmtVal(tp?.ph)],
    ['Erime noktası / Donma noktası',     tp?.melting_point  ? fmtVal(tp.melting_point, '°C')               : NA],
    ['Başlangıç kaynama noktası (IBP)',   fmtVal(tp?.boiling_point, '°C')],
    ['Parlama noktası',                   tp?.flash_point    ? fmtVal(tp.flash_point, '°C')                 : NA],
    ['Buharlaşma hızı',                   tp?.evap_rate      ? fmtStr(tp.evap_rate)                         : NA],
    ['Alevlenirlik (katı, gaz)',          tp?.flam_sg        ? fmtStr(tp.flam_sg)                           : NA],
    ['Üst patlama limiti (UEL)',          fmtVal(tp?.uel, '%v/v')],
    ['Alt patlama limiti (LEL)',          fmtVal(tp?.lel, '%v/v')],
    ['Buhar basıncı',                     fmtVal(tp?.vapor_pressure, 'hPa @ 20°C')],
    ['Buhar yoğunluğu (hava=1)',          fmtVal(tp?.vapor_density)],
    ['Göreceli (bağıl) yoğunluk',         fmtVal(tp?.density, 'g/cm³')],
    ['Su içinde çözünürlük',              tp?.solubility     ? fmtVal(tp.solubility, 'mg/L')               : NA],
    ['Diğer çözücülerdeki çözünürlük',   tp?.sol_other      ? fmtStr(tp.sol_other)                         : NA],
    ['Dağılım katsayısı (log Kow)',       tp?.log_kow        ? fmtVal(tp.log_kow)                          : NA],
    ['Kendiliğinden tutuşma sıcaklığı',  tp?.auto_ignition  ? fmtVal(tp.auto_ignition, '°C')              : NA],
    ['Bozunma sıcaklığı',                tp?.decomp_temp    ? fmtVal(tp.decomp_temp, '°C')                 : NA],
    ['Viskozite (dinamik)',               tp?.viscosity      ? fmtVal(tp.viscosity, 'mPa·s')               : NA],
    ['Patlayıcılık özellikleri',         tp?.explosive      ? fmtStr(tp.explosive)                         : NA],
    ['Oksitleyici özellikler',           tp?.oxidizing      ? fmtStr(tp.oxidizing)                         : NA],
  ];

  const covBadge = tp?.coverage > 0
    ? `<div style="font-size:9px;color:var(--text3);padding:8px 0 4px">
        DB kapsama: <strong style="color:${tp.coverage>=80?'#68d391':tp.coverage>=50?'#f6ad55':'#fc8181'}">%${tp.coverage}</strong>
        &nbsp;·&nbsp; Teorik tahminler: ISO 2811 · Raoult/Le Chatelier · ISO 10156/EN 1839 · NIST WebBook
       </div>` : '';

  body.innerHTML = covBadge + rows.map(([lbl, val]) => `
    <div class="pm-row">
      <div class="pm-label">${lbl}</div>
      <div>${val}</div>
    </div>`).join('');

  document.getElementById('physModalOverlay').classList.add('open');
}

function closePhysModal() {
  document.getElementById('physModalOverlay')?.classList.remove('open');
}

async function generatePDF() {
  if (!_lastCalcState) { alert('Önce Hesapla\'ya basın.'); return; }

  const btn = document.querySelector('[onclick="generatePDF()"]');
  if (btn) { btn.textContent = '⏳ Oluşturuluyor...'; btn.disabled = true; }

  try {
    const { allH, combinedSignal, transport, euh, phys, clp, comps, eco, ppe, pcodes } = _lastCalcState;
    const productName = document.getElementById('productName')?.value?.trim() || 'Ürün';
    const form  = document.getElementById('pform')?.value  || 'liquid';
    const usage = document.getElementById('pusage')?.value || 'industrial';

    // phys_props — theoProps'tan düz objeye çevir (alan isimleri backend ile eşleşmeli)
    const tp = phys?.theoProps || {};
    const flatPhys = {};
    // Doğrudan eşleşen alanlar
    const physKeys = ['density','boiling_point','flash_point','lel','uel','ph','viscosity',
      'solubility','appearance','odor','melting_point','auto_ignition',
      'vapor_pressure','vapor_density','log_kow'];
    physKeys.forEach(k => {
      if (!tp[k]) return;
      flatPhys[k] = tp[k].value !== undefined ? tp[k].value : tp[k];
    });
    // Alan adı dönüşümleri (frontend → backend)
    if (tp.odor_threshold)  flatPhys.odour_threshold    = tp.odor_threshold.value;
    if (tp.decomp_temp)     flatPhys.decomposition_temp = tp.decomp_temp.value;
    if (tp.explosive)       flatPhys.is_explosive       = tp.explosive.value;
    if (tp.oxidizing)       flatPhys.is_oxidising       = tp.oxidizing.value;
    if (tp.flam_sg)         flatPhys.is_flammable       = tp.flam_sg.value;

    // clp_passed — her H kodu için h_class + kesme değeri bilgisi
    // h_class'ı bileşen hazards listesinden bul
    const hClassMap = {};
    comps.forEach(c => {
      (c.hazards || []).forEach(hz => {
        const code = (hz.h_code || '').replace(/[*\s]/g,'').substring(0,4);
        if (code && !hClassMap[code]) hClassMap[code] = hz.h_class || '';
      });
    });
    const cutoffUsed = clp?.cutoffUsed || {};

    // Fiziksel H kodları için gerekçe (parlama noktası / aspirasyon kaynağı)
    const physReasonMap = {};
    (phys?.results || []).forEach(r => {
      const hc = r.h || r.h_code;
      if (!hc) return;
      if (r.source) physReasonMap[hc] = r.source;
    });

    const clpPassed = allH.map(hc => {
      const cu = cutoffUsed[hc];
      let reason = '';
      if (cu) {
        reason = `${cu.source} ≥ %${cu.value}`;
      } else if (CLP_CUTOFFS[hc] !== undefined) {
        reason = `GCL ≥ %${CLP_CUTOFFS[hc]}`;
      } else if (physReasonMap[hc]) {
        // Fiziksel tehlike: parlama noktası / asp. toksisitesi kaynağı
        reason = physReasonMap[hc];
      }
      return {
        h_code:      hc,
        h_class:     hClassMap[hc] || '',
        reason,
        cutoff_used: reason || '—',
      };
    });

    const payload = {
      lang: 'TR',
      product: { name: productName, form, usage },
      supplier: {},
      components: comps.map(c => ({
        cas:      c.cas,
        name:     c.name,
        conc:     c.conc,
        ec_no:    c.ec || '',
        reach_no: c.reach || '',
        hazards:  c.hazards || [],
      })),
      h_codes:      allH,
      clp_passed:   clpPassed,
      euh_codes:    euh?.codes || [],
      euh_details:  euh?.details || [],
      signal_word:  combinedSignal,
      transport:    transport || {},
      phys_props:   flatPhys,
      eco: {
        aquatic:      eco?.aquatic   || null,
        h_codes:      eco?.h_codes   || [],
        ozone:        eco?.ozone     || [],
        pbt:          eco?.pbt       || [],
      },
      ppe:          ppe || [],
      p_codes: {
        p_codes: pcodes?.codes       || [],   // tüm P kodları (SDS Bölüm 7 vb.)
        label: {
          selected: pcodes?.label_codes || [], // etiket için seçilmiş max 6-10
        },
      },
      revision:     { date: new Date().toLocaleDateString('tr-TR'), no: '1', version: '1.0', notes: 'İlk yayın' },
    };

    const res = await fetch(API_BASE + '/sds/pdf', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });

    if (!res.ok) {
      const err = await res.text();
      throw new Error(`API hatası ${res.status}: ${err}`);
    }

    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `${productName.replace(/\s+/g,'_')}_SDS.pdf`;
    a.click();
    URL.revokeObjectURL(url);

  } catch (e) {
    alert('PDF oluşturma hatası: ' + e.message);
    console.error('[PDF]', e);
  } finally {
    if (btn) { btn.innerHTML = '📄 PDF Oluştur'; btn.disabled = false; }
  }
}

function toggleSec9Extra() {
  const el  = document.getElementById('sec9Extra');
  const btn = document.getElementById('sec9ExtraBtn');
  const open = el.style.display !== 'none';
  el.style.display  = open ? 'none' : 'block';
  btn.textContent   = open ? '▼ Daha fazla...' : '▲ Daha az';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePhysModal(); });
</script>
